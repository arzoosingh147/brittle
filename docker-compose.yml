services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brittle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brittle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brittle_secret}
      POSTGRES_DB: ${POSTGRES_DB:-brittle_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brittle} -d ${POSTGRES_DB:-brittle_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brittle-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
